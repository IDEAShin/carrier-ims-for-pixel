name: Android 17 Test APK

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/android17-test.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Generate temporary debug keystore
        shell: bash
        run: |
          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/android17-debug.jks" \
            -storepass android17test \
            -alias android17debug \
            -keypass android17test \
            -keyalg RSA \
            -keysize 2048 \
            -validity 30 \
            -dname "CN=Android 17 Test,OU=Debug,O=IDEAShin,L=Test,ST=Test,C=US"

      - name: Build debug APK
        env:
          TURBOIMS_DEBUG_APPLICATION_ID_SUFFIX: .android17test
          SIGN_KEY_STORE_FILE: ${{ runner.temp }}/android17-debug.jks
          SIGN_KEY_STORE_PASSWORD: android17test
          SIGN_KEY_ALIAS: android17debug
          SIGN_KEY_PASSWORD: android17test
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: carrier-ims-android17-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
